name: Defensive Agent Security Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify local policy is present
        run: |
          test -f .github/FREEBUFF_SECURITY_ONLY.md
          grep -q "SECURITY-ONLY / DEFENSIVE OBSERVABILITY" .github/FREEBUFF_SECURITY_ONLY.md
      - name: Detect tracked secret-bearing filenames and private key material
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          blocked_names = {".env", ".env.local", ".env.production", "id_rsa", "id_ed25519"}
          violations = []

          for item in tracked:
              path = Path(item)
              if path.name in blocked_names or (path.name.startswith(".env.") and path.name != ".env.example"):
                  violations.append(f"tracked sensitive filename: {item}")
                  continue
              try:
                  if path.stat().st_size > 1_000_000:
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              if re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----", text):
                  violations.append(f"private key material: {item}")
              if re.search(r"(?<![A-Za-z0-9_])(ghp|github_pat)_[A-Za-z0-9_]{20,}", text):
                  violations.append(f"GitHub token-shaped value: {item}")

          if violations:
              print("\n".join(violations))
              sys.exit(1)
          print("PASS: policy present and no baseline secret indicators found.")
