name: Cassandra-Run Release Signing

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # necessário para cosign keyless (OIDC)

jobs:
  sign-and-anchor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release context
        run: |
          echo "Signing release $GITHUB_REF"
          test "${GITHUB_REF_TYPE}" = "tag"

      - name: Generate coherence proof
        run: |
          python mvp/scripts/generate_coherence_proof.py > coherence_proof.json

      - name: Sign and anchor coherence proof
        run: |
          python mvp/scripts/sign_and_anchor.py coherence_proof.json

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: coherence-proof-signed
          path: coherence_proof.json
