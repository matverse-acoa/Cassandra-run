name: Architectural Enforcement

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  enforce-architecture:
    runs-on: ubuntu-latest
    env:
      MATVERSE_ROLE: foundation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run architectural enforcement
        run: ./scripts/architectural-enforcement.sh
